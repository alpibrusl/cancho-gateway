# A deployment: what the generator (scripts/generate.py) compiles into the binary (docs/design.md section 2).
# The route table (task #4) will refer to these upstreams by name; this file only fixes the set.

listen = 8080

[[upstream]]
name = "api"
addr = "10.0.1.5:9000"

[[upstream]]
name = "web"
addr = "10.0.1.6:9000"

# Routes (docs/routes.md). The host selects the route set first (routes with that host, else routes with no host); inside
# it the longest path_prefix wins; a tie is an error.

[[route]]
name = "api"
host = "api.example.com"
path_prefix = "/"
upstream = "api"

[[route]]
name = "web-static"
path_prefix = "/static"
methods = ["GET", "HEAD"]
upstream = "web"
max_body = 0

[[route]]
name = "web"
path_prefix = "/"
upstream = "web"

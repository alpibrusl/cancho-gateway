# The authority ceiling of the gateway (docs/design.md section 3; the model is cancho-tools' tools.toml).
#
# This file is what a person writes and reviews. It is a *ceiling*, never the authority: the authority
# is whatever `cancho authority` derives from the source (manifests/gateway.authority.json), and
# scripts/authority.py --check fails when a derived label is not allowed here. Widening the gateway is
# therefore an edit to this file: a reviewable diff. The derived set may be smaller, never larger.
#
# A label with an argument is written as the compiler prints it: net_out("10.0.1.").
#
# The gateway's row (docs/design.md section 3, section 2.1): the network both ways and unnarrowed (one bound serves listen and
# connect, so the compiler cannot carry the upstream set: `gateway.egress` enforces it), the clock for deadlines, the heap for
# the slabs sized at start, args for `--version`, standard output for it. Never: ffi, fs_write, file_write, dir_write.
#
# The TLS code is in every build (a deployment without `tls_listen` releases the filesystem capability unread, so it reports no `fs_read`), and it
# reads certificates through a directory handle: `dir_read` and `file_read` (docs/tls.md section 4). `gateway-tls` is the same program as built for
# deploy/examples/tls.toml: it adds exactly two named paths, and scripts/authority.py fails on any other `fs_read`.
#
# Slice 2 (docs/tls.md section 11) adds `signals("HUP,INT,TERM")` and `signals_read` to both rows, deliberately: SIGHUP reloads the certificates, SIGINT and
# SIGTERM stop the process cleanly. The claim is in every build (a deployment without `tls_listen` treats SIGHUP as a no-op, and stops on the other two),
# and it is exactly those three signals: the compiler refuses a claim of any other name, and the report prints the set. `err_write` (the reload's log
# line on standard error) was already within the ceiling and is now derived.

[gateway]
allow = ["args", "clock", "conn_accept", "conn_read", "conn_write", "dir_read", "file_read", "heap", "io_write", "err_write", "net_in(\"\")", "net_out(\"\")", "poll", "signals(\"HUP,INT,TERM\")", "signals_read"]

[gateway-tls]
allow = ["args", "clock", "conn_accept", "conn_read", "conn_write", "dir_read", "file_read", "fs_read(\"/dev/urandom\")", "fs_read(\"/etc/cancho-gateway/tls\")", "heap", "io_write", "err_write", "net_in(\"\")", "net_out(\"\")", "poll", "signals(\"HUP,INT,TERM\")", "signals_read"]

# A test tool: reads its input from argv, answers on standard output. No network, no files.
[framing_probe]
allow = ["args", "io_write"]

# A test tool: reads requests from argv, answers on standard output. No network, no files.
[route_probe]
allow = ["args", "io_write"]

# A test tool: reads a response head from argv, answers on standard output. No network, no files.
[response_probe]
allow = ["args", "io_write"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 927" role="img" aria-label="Requests per second of seven proxies in five benchmark cells, one run, fastest first. cancho-gateway is slower than HAProxy in four cells, slower than nginx in three of them in this run, and faster than both with Connection: close.">

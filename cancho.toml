[package]
name = "cancho-gateway"
cancho = "2fcf4cde156dbc118d2545dae84d6e054c4118e4"   # the compiler these sources were written for; CI builds this commit

# The TLS 1.3 server (cancho's packages/tls, and the x509 package it requires, fetched with it): a full commit hash, never a name. The store
# is inside cancho's repository at that commit; `cancho build` and `cancho test` fetch it, re-typecheck and re-hash every declaration (docs/tls.md).
[dependencies.tls]
git = "https://github.com/alpibrusl/cancho"
rev = "2fcf4cde156dbc118d2545dae84d6e054c4118e4"
path = "packages/tls/.cancho-vcs/tls"

# One program, one authority row (docs/design.md section 3). The deployment
# generator (task #11) will add a generated module here per deployment.

[[bin]]
name = "gateway"
sources = ["generated/deploy.cho", "generated/routes.cho", "src/out.cho", "src/accesslog.cho", "src/problem.cho", "src/framing.cho", "src/chunked.cho", "src/route.cho", "src/response.cho", "src/forward.cho", "src/egress.cho", "src/admin.cho", "src/metrics.cho", "generated/tlsfiles.cho", "src/tlsids.cho", "src/tlsio.cho", "src/shared.cho", "src/adminloop.cho", "src/proxy.cho", "src/version.cho", "src/gateway.cho"]
std = true
out = "build/gateway"

[[bin]]
name = "framing_probe"
sources = ["src/framing.cho", "src/chunked.cho", "src/framing_probe.cho"]
std = true
out = "build/framing_probe"

[[bin]]
name = "route_probe"
sources = ["generated/routes.cho", "src/route.cho", "src/route_probe.cho"]
std = true
out = "build/route_probe"

[[bin]]
name = "response_probe"
sources = ["src/response.cho", "src/response_probe.cho"]
std = true
out = "build/response_probe"

[[test]]
name = "version"
sources = ["src/version.cho", "tests/version_test.cho"]
std = true

[[test]]
name = "egress"
sources = ["generated/deploy.cho", "src/egress.cho", "tests/egress_test.cho"]
std = true

[[test]]
name = "problem"
sources = ["src/out.cho", "src/problem.cho", "tests/problem_test.cho"]
std = true

[[test]]
name = "forward"
sources = ["src/out.cho", "src/response.cho", "src/forward.cho", "tests/forward_test.cho"]
std = true

[[test]]
name = "accesslog"
sources = ["src/out.cho", "src/accesslog.cho", "tests/accesslog_test.cho"]
std = true

[[test]]
name = "metrics"
sources = ["generated/deploy.cho", "generated/routes.cho", "src/out.cho", "src/route.cho", "src/metrics.cho", "tests/metrics_test.cho"]
std = true

[[test]]
name = "admin"
sources = ["src/admin.cho", "tests/admin_test.cho"]
std = true

[[test]]
name = "metrics_bound"
sources = ["generated/deploy.cho", "generated/routes.cho", "src/out.cho", "src/route.cho", "src/metrics.cho", "tests/metrics_bound_test.cho"]
std = true

[[test]]
name = "metrics_bound_long"
sources = ["tests/fixtures/long/deploy.cho", "tests/fixtures/long/routes.cho", "src/out.cho", "src/route.cho", "src/metrics.cho", "tests/metrics_bound_test.cho"]
std = true

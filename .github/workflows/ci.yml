name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gateway

      # The compiler is whichever commit cancho.toml says these sources were written for.
      - name: Read the compiler pin from cancho.toml
        id: pin
        run: echo "rev=$(sed -n 's/^cancho *= *"\([0-9a-f]*\)".*/\1/p' gateway/cancho.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ steps.pin.outputs.rev }}
          path: cancho

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: cancho/target/release/cancho
          key: cancho-${{ steps.pin.outputs.rev }}

      - name: Build cancho
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: cancho
        run: cargo build --release -p cancho

      - name: Put the compiler on PATH
        run: echo "$GITHUB_WORKSPACE/cancho/target/release" >> "$GITHUB_PATH"

      - name: Formatting
        working-directory: gateway
        run: cancho fmt --check src tests generated

      - name: The generated module matches the deployment file, and the generator's own tests
        working-directory: gateway
        run: |
          python3 scripts/generate.py deploy/example.toml --check
          python3 scripts/generate.py tests/fixtures/long/deploy.toml --out tests/fixtures/long --check
          for f in deploy/demo.toml deploy/examples/*.toml; do python3 scripts/generate.py "$f" --out "$RUNNER_TEMP" > /dev/null; done
          python3 tests/generate_test.py

      - name: Build
        working-directory: gateway
        run: cancho build

      - name: Request framing against the smuggling corpus, split delivery and mutated heads
        working-directory: gateway
        run: |
          python3 tests/smuggling/run.py --gateway
          python3 tests/smuggling/run.py --prefixes
          python3 tests/smuggling/run.py --chunked
          python3 tests/smuggling/run.py --fuzz 1500

      - name: Upstream response heads against the corpus, split delivery and mutated heads
        working-directory: gateway
        run: python3 tests/response/run.py

      - name: Route selection against the reference, over generated tables
        working-directory: gateway
        run: |
          python3 tests/route_test.py 12 400
          python3 tests/route_test.py --fixed

      - name: The proxy core against real sockets and an upstream that misbehaves
        working-directory: gateway
        run: python3 tests/proxy_test.py

      - name: The admin listener and the metrics against an independent count made from the access log
        working-directory: gateway
        run: python3 tests/admin_test.py

      - name: TLS against Python's ssl, openssl and curl; the handshake bounds, hostile clients, and the smuggling corpus over TLS
        working-directory: gateway
        run: python3 tests/tls_test.py

      - name: WebSocket (docs/websocket.md) against a client and an upstream written from RFC 6455, plain and over TLS; the mutants are run by hand (tests/websocket_mutants.py)
        working-directory: gateway
        run: |
          python3 -m pip install websockets==17.2   # an implementation that is not ours, on each side of the gateway (the test skips its two interop cases without it)
          python3 tests/websocket_test.py

      - name: The header policy against nginx (the table in the test says where they differ on purpose, and why)
        working-directory: gateway
        run: |
          sudo apt-get install -y nginx
          sudo systemctl stop nginx || true
          NGINX=/usr/sbin/nginx python3 tests/headers/differential.py

      - name: Tests
        working-directory: gateway
        run: cancho test

      - name: No source file over 2,000 lines
        working-directory: gateway
        run: python3 scripts/lines.py

      - name: The authority is the compiler's, recorded, and within its ceiling
        working-directory: gateway
        run: |
          python3 scripts/authority.py --check
          python3 tests/authority_test.py

      - name: The site (docs/index.html, evidence.html) - its figures and tables come from the recorded results, and its links resolve
        working-directory: gateway
        run: |
          python3 scripts/figures.py --check
          python3 scripts/check_site.py

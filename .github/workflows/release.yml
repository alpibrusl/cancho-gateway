name: release

# Push a tag (v0.1.0) and this builds the demo binary at the pinned compiler, checks its authority report, and attaches
# the binary, the report, the sources and SHA256SUMS to a GitHub release. The site's download button points at the latest one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gateway

      - name: Read the compiler pin from cancho.toml
        id: pin
        run: echo "rev=$(sed -n 's/^cancho *= *"\([0-9a-f]*\)".*/\1/p' gateway/cancho.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ steps.pin.outputs.rev }}
          path: cancho

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: cancho/target/release/cancho
          key: cancho-${{ steps.pin.outputs.rev }}

      - name: Build cancho
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: cancho
        run: cargo build --release -p cancho

      - name: Put the compiler on PATH
        run: echo "$GITHUB_WORKSPACE/cancho/target/release" >> "$GITHUB_PATH"

      - name: Build the release assets
        working-directory: gateway
        run: scripts/release.sh

      - name: Publish
        if: github.ref_type == 'tag'
        working-directory: gateway
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --prerelease \
            --notes "Alpha. The demo gateway (listens on 8080, one upstream on 127.0.0.1:9000), its authority report, the sources to build your own, and SHA256SUMS. See https://alpibrusl.github.io/cancho-gateway/"

      - name: Keep the assets when run by hand
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: gateway/dist/*

name: release

# Push a tag (v0.1.0) and this builds the demo binary with the pinned compiler, checks its authority report, and attaches
# the binary, the report, the sources and SHA256SUMS to a GitHub release. The site's download button points at the latest one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish the assets onto this existing tag's release (empty: build only, keep the assets as a run artifact)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gateway
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the pinned compiler
        working-directory: gateway
        run: |
          pin=$(sed -n 's/^cancho *= *"\([0-9a-f.]*\)".*/\1/p' cancho.toml)
          test -n "$pin" || { echo "cancho.toml has no compiler pin" >&2; exit 1; }
          curl -fsSL https://raw.githubusercontent.com/alpibrusl/cancho/main/scripts/install.sh | sh -s "$pin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the release assets
        working-directory: gateway
        run: scripts/release.sh

      - name: Publish (creates the release, or adds the assets to one that exists)
        if: github.ref_type == 'tag' || inputs.tag != ''
        working-directory: gateway
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes="Alpha. The demo gateway (listens on 8080, one upstream on 127.0.0.1:9000), its authority report, the sources to build your own, and SHA256SUMS. See https://alpibrusl.github.io/cancho-gateway/"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes "$notes"
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes "$notes"
          fi

      - name: Keep the assets when nothing is published
        if: github.ref_type != 'tag' && inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: gateway/dist/*

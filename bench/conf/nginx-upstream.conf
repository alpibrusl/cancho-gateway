# The upstream every proxy is measured against: nginx serving fixed answers, two workers, never the bottleneck (checked per cell).
worker_processes 2;
pid @DIR@/nginx-up.pid;
error_log /dev/null crit;
events { worker_connections 4096; }
http {
    access_log off;
    client_body_temp_path @DIR@/up-body;
    proxy_temp_path @DIR@/up-proxy;
    fastcgi_temp_path @DIR@/up-fcgi;
    uwsgi_temp_path @DIR@/up-uwsgi;
    scgi_temp_path @DIR@/up-scgi;
    client_max_body_size 1m;
    keepalive_requests 1000000;
    server {
        listen @UP@ backlog 4096;
        root @DIR@/www;
        location = / { default_type text/plain; return 200 "ok"; }
        location = /big { default_type application/octet-stream; try_files /big.bin =404; }
        location = /post { default_type text/plain; return 200 "ok"; }
    }
}

# HAProxy as a plain HTTP reverse proxy: one thread, keep-alive both sides, connection reuse, no logging (docs/bench.md).
global
    nbthread 1
    maxconn 4096
    pidfile @DIR@/haproxy.pid
defaults
    mode http
    option http-keep-alive
    http-reuse always
    timeout connect 5s
    timeout client 60s
    timeout server 60s
frontend f
    bind 127.0.0.1:@PORT@
    default_backend b
backend b
    server s 127.0.0.1:@UP@

# nginx as a plain reverse proxy: one worker, keep-alive to the upstream, no access log (docs/bench.md).
user root;
worker_processes 1;
pid @DIR@/nginx.pid;
error_log /dev/null crit;
events { worker_connections 4096; }
http {
    access_log off;
    client_body_temp_path @DIR@/nginx-body;
    proxy_temp_path @DIR@/nginx-proxy;
    fastcgi_temp_path @DIR@/nginx-fcgi;
    uwsgi_temp_path @DIR@/nginx-uwsgi;
    scgi_temp_path @DIR@/nginx-scgi;
    client_max_body_size 1m;
    upstream u { server 127.0.0.1:@UP@; keepalive 64; }
    server {
        listen @PORT@ backlog=4096;
        location / {
            proxy_pass http://u;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}

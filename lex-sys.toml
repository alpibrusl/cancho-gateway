[package]
name = "lexsys-gateway"
lex-sys = "0dfc81ca680c49c5c88ac7e53c103a037c7e9f02"   # the compiler these sources were written for; CI builds this commit

# One program, one authority row (docs/design.md section 3). The deployment
# generator (task #11) will add a generated module here per deployment.

[[bin]]
name = "gateway"
sources = ["generated/deploy.ls", "generated/routes.ls", "src/out.ls", "src/problem.ls", "src/framing.ls", "src/chunked.ls", "src/route.ls", "src/response.ls", "src/forward.ls", "src/egress.ls", "src/proxy.ls", "src/version.ls", "src/gateway.ls"]
std = true
out = "build/gateway"

[[bin]]
name = "framing_probe"
sources = ["src/framing.ls", "src/chunked.ls", "src/framing_probe.ls"]
std = true
out = "build/framing_probe"

[[bin]]
name = "route_probe"
sources = ["generated/routes.ls", "src/route.ls", "src/route_probe.ls"]
std = true
out = "build/route_probe"

[[bin]]
name = "response_probe"
sources = ["src/response.ls", "src/response_probe.ls"]
std = true
out = "build/response_probe"

[[test]]
name = "version"
sources = ["src/version.ls", "tests/version_test.ls"]
std = true

[[test]]
name = "egress"
sources = ["generated/deploy.ls", "src/egress.ls", "tests/egress_test.ls"]
std = true

[[test]]
name = "problem"
sources = ["src/out.ls", "src/problem.ls", "tests/problem_test.ls"]
std = true

[[test]]
name = "forward"
sources = ["src/out.ls", "src/response.ls", "src/forward.ls", "tests/forward_test.ls"]
std = true
